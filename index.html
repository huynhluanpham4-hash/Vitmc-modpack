<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Custom Sunset & Night Cycle - Beautiful Edition</title>
    <style>
        /* Tối ưu render pixel sắc nét phong cách Minecraft */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        body {
            background-color: #050008;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: monospace;
        }

        /* Khung tranh tỷ lệ 16:9 mượt mà với chu kỳ 30 giây */
        .viewport {
            position: relative;
            width: 800px;
            height: 450px;
            border: 10px solid #140b07;
            box-shadow: 0 40px 90px rgba(0,0,0,0.95);
            overflow: hidden;
            animation: sky-cycle 30s infinite linear;
        }

        /* ==================== 1. CHU KỲ BẦU TRỜI 30S (SKY CYCLE) ==================== */
        @keyframes sky-cycle {
            /* BAN NGÀY (DAY) */
            0%, 20% {
                background: linear-gradient(to bottom, #4fa3e3 0%, #7ec2f6 40%, #bce2ff 75%, #e1f2ff 100%);
            }
            /* HOÀNG HÔN (SUNSET) */
            35% {
                background: linear-gradient(to bottom, #ff5100 0%, #ff7b00 20%, #ffaa43 45%, #a83210 70%, #1a0510 100%);
            }
            /* CHẬM TỐI (DUSK) */
            45% {
                background: linear-gradient(to bottom, #2c1654 0%, #461f5b 30%, #7d3c52 60%, #b2583f 85%, #18051a 100%);
            }
            /* BAN ĐÊM (NIGHT) */
            55%, 75% {
                background: linear-gradient(to bottom, #060514 0%, #0c0b24 40%, #151336 75%, #241c42 100%);
            }
            /* BÌNH MINH (SUNRISE) */
            85% {
                background: linear-gradient(to bottom, #ff5500 0%, #ff8c00 30%, #ffb732 60%, #ffd97d 85%, #200a3a 100%);
            }
            /* QUAY LẠI BAN NGÀY */
            95%, 100% {
                background: linear-gradient(to bottom, #4fa3e3 0%, #7ec2f6 40%, #bce2ff 75%, #e1f2ff 100%);
            }
        }

        /* Lớp sương mù phát sáng chân trời */
        .horizon-fog {
            position: absolute;
            bottom: 60px;
            width: 100%;
            height: 160px;
            mix-blend-mode: screen;
            pointer-events: none;
            z-index: 3;
            animation: fog-cycle 30s infinite linear;
        }

        @keyframes fog-cycle {
            0%, 20%, 95%, 100% { background: linear-gradient(to top, rgba(255, 255, 255, 0.15) 0%, transparent 100%); }
            35% { background: linear-gradient(to top, rgba(255, 100, 10, 0.4) 0%, rgba(255, 160, 40, 0.15) 60%, transparent 100%); }
            55%, 75% { background: linear-gradient(to top, rgba(21, 19, 54, 0.25) 0%, transparent 100%); }
            85% { background: linear-gradient(to top, rgba(255, 120, 20, 0.35) 0%, rgba(255, 180, 50, 0.1) 60%, transparent 100%); }
        }

        /* Lớp phủ ánh sáng môi trường (Ambient Light) dịu nhẹ */
        .ambient-glow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 4;
            mix-blend-mode: screen;
            animation: ambient-cycle 30s infinite linear;
        }

        @keyframes ambient-cycle {
            0%, 20% { background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, transparent 80%); }
            35% { background: radial-gradient(circle at 40% 40%, rgba(255, 120, 10, 0.4) 0%, rgba(255, 50, 0, 0.1) 60%, transparent 90%); }
            55%, 75% { background: rgba(0, 0, 0, 0.3); mix-blend-mode: multiply; } /* Đêm tối ấm áp mờ nhẹ */
            85% { background: radial-gradient(circle at 70% 40%, rgba(255, 160, 30, 0.3) 0%, rgba(255, 70, 0, 0.05) 60%, transparent 90%); mix-blend-mode: screen; }
            95%, 100% { background: none; }
        }

        /* ==================== 2. MẶT TRỜI VUÔNG & MẶT TRĂNG VUÔNG MINECRAFT ==================== */
        
        /* Mặt trời vuông xếp lớp nghệ thuật */
        .sun-container {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1;
            animation: sun-orbit 30s infinite linear;
        }

        .sun-core {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            /* Tạo các lớp viền phát sáng vuông góc cực đẹp như ảnh 1 */
            box-shadow: 
                0 0 0 8px rgba(255, 255, 255, 0.5),
                0 0 0 20px rgba(255, 215, 0, 0.3),
                0 0 0 40px rgba(255, 100, 0, 0.15),
                0 0 80px 20px rgba(255, 60, 0, 0.1);
        }

        @keyframes sun-orbit {
            0%, 20% { transform: translate(360px, 40px); opacity: 1; }
            35% { transform: translate(250px, 120px); opacity: 1; }
            45%, 75% { transform: translate(120px, 450px); opacity: 0; } /* Biến mất khi đêm xuống */
            85% { transform: translate(550px, 120px); opacity: 1; }
            95%, 100% { transform: translate(360px, 40px); opacity: 1; }
        }

        /* Mặt trăng vuông mọc lên vào ban đêm */
        .moon-container {
            position: absolute;
            width: 45px;
            height: 45px;
            z-index: 1;
            animation: moon-orbit 30s infinite linear;
        }

        .moon-core {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #e3f2fd;
            box-shadow: 
                0 0 0 6px rgba(227, 242, 253, 0.4),
                0 0 0 15px rgba(100, 181, 246, 0.2),
                0 0 40px 10px rgba(33, 150, 243, 0.15);
        }

        @keyframes moon-orbit {
            0%, 40% { transform: translate(650px, 450px); opacity: 0; } /* Trốn dưới núi ban ngày */
            55%, 70% { transform: translate(360px, 50px); opacity: 1; } /* Hiện rõ giữa trời đêm */
            80%, 100% { transform: translate(100px, 450px); opacity: 0; }
        }

        /* Mây vuông Minecraft lững lờ trôi */
        .cloud {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.35);
            box-shadow: inset -4px -4px 0 rgba(220, 220, 220, 0.3);
            z-index: 1;
            animation: cloud-move 20s infinite linear;
        }
        .c1 { width: 120px; height: 25px; top: 30px; left: -150px; animation-duration: 25s; }
        .c2 { width: 85px; height: 20px; top: 75px; left: -100px; animation-duration: 18s; animation-delay: 5s; }

        @keyframes cloud-move {
            0% { transform: translateX(0); }
            100% { transform: translateX(1100px); }
        }

        /* ==================== 3. CÁC CHI TIẾT SÂN KHẤU (ĐẸP NHƯ GỐC - KHÓA CHẶT MÀU) ==================== */

        /* Núi hùng vĩ phía sau */
        .mountains-bg {
            position: absolute;
            bottom: 60px;
            width: 100%;
            height: 140px;
            background-color: #210c06;
            clip-path: polygon(
                0% 100%, 0% 68%, 6% 68%, 6% 58%, 14% 58%, 14% 48%, 20% 48%, 20% 53%,
                28% 53%, 28% 43%, 35% 43%, 35% 33%, 41% 33%, 41% 38%, 45% 38%, 45% 53%,
                53% 53%, 53% 43%, 61% 43%, 61% 28%, 67% 28%, 67% 38%, 75% 38%, 75% 58%,
                87% 58%, 87% 63%, 100% 63%, 100% 100%
            );
            z-index: 2;
        }

        /* Mặt đất cỏ xanh */
        .ground-flat {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 70px;
            background-color: #1e2c0d;
            border-top: 8px solid #33471a;
            z-index: 10;
            box-shadow: inset 0 12px 25px rgba(0,0,0,0.6);
        }

        .ground-flat::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: rgba(255, 255, 255, 0.12);
        }

        /* Hàng rào gỗ hai bên */
        .fence-left {
            position: absolute;
            bottom: 55px;
            left: 30px;
            width: 80px;
            height: 35px;
            background: 
                linear-gradient(to right, #180a05 12px, transparent 12px) 0 0/24px 100%,
                linear-gradient(to bottom, #241108 8px, transparent 8px) 0 8px/100% 100%;
            z-index: 11;
        }

        .fence-right {
            position: absolute;
            bottom: 50px;
            right: 40px;
            width: 100px;
            height: 30px;
            background: 
                linear-gradient(to right, #180a05 12px, transparent 12px) 0 0/30px 100%,
                linear-gradient(to bottom, #241108 6px, transparent 6px) 0 6px/100% 100%;
            z-index: 11;
        }

        /* Tán lá anh đào (Cherry Blossom) rủ góc trái */
        .cherry-canopy-2d {
            position: absolute;
            top: 0;
            left: 8%;
            width: 50%;
            height: 95px;
            background-color: #b3395d;
            clip-path: polygon(
                0 0, 100% 0, 100% 55%,
                90% 55%, 90% 75%,
                75% 75%, 75% 100%,
                50% 100%, 50% 85%,
                30% 85%, 30% 65%,
                0 65%
            );
            box-shadow: 
                inset -15px -15px 0 #882444,
                inset 4px -4px 0 rgba(255, 255, 255, 0.15), 
                0 12px 0 rgba(0,0,0,0.45);
            z-index: 15;
        }

        /* Khúc gỗ sồi ở góc phải */
        .oak-log-2d {
            position: absolute;
            top: 0;
            right: 12%;
            width: 160px;
            height: 60px;
            background-color: #1b0c05;
            clip-path: polygon(
                0 0, 100% 0, 100% 70%,
                85% 70%, 85% 90%,
                40% 90%, 40% 75%,
                0 75%
            );
            box-shadow: 
                inset -10px -10px 0 #0f0602,
                inset 3px -3px 0 rgba(255, 255, 255, 0.1),
                0 10px 0 rgba(0,0,0,0.5);
            z-index: 14;
        }

        /* ==================== 4. ĐỐNG LỬA TRẠI & HIỆU ỨNG HẠT CHUYỂN ĐỘNG ==================== */

        /* Quầng sáng lửa ấm áp nhấp nháy */
        .campfire-glow {
            position: absolute;
            bottom: -30px;
            left: 90px;
            width: 190px;
            height: 190px;
            background: radial-gradient(circle, rgba(255, 130, 10, 0.6) 0%, rgba(255, 50, 0, 0.18) 55%, transparent 75%);
            mix-blend-mode: screen;
            pointer-events: none;
            z-index: 13;
            animation: fire-flicker-light 0.15s infinite alternate ease-in-out;
        }

        @keyframes fire-flicker-light {
            0% { transform: scale(0.95); opacity: 0.85; }
            100% { transform: scale(1.05); opacity: 1; }
        }

        /* Đống lửa trại chi tiết */
        .campfire-2d {
            position: absolute;
            bottom: 45px;
            left: 160px;
            width: 60px;
            height: 55px;
            z-index: 12;
        }
        .campfire-wood {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 12px;
            background-color: #2b140a;
            border-top: 2px solid #3d2114;
            box-shadow: 
                -10px -5px 0 #180a05,
                10px -5px 0 #180a05,
                inset 0 -3px 0 #0f0602;
        }
        .coal-glow {
            position: absolute;
            bottom: 3px;
            left: 18px;
            width: 24px;
            height: 6px;
            background-color: #ff3300;
            box-shadow: 
                0 0 8px #ff5500,
                inset 0 1px 0 #ffaa00;
            animation: coal-pulse 0.4s infinite alternate;
        }

        @keyframes coal-pulse {
            0% { opacity: 0.7; }
            100% { opacity: 1; background-color: #ff6600; }
        }

        /* Ngọn lửa 3 lớp sinh động */
        .fire-wrapper {
            position: absolute;
            bottom: 10px;
            left: 15px;
            width: 30px;
            height: 45px;
        }
        .fire-outer {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            background-color: #ff3f34;
            clip-path: polygon(50% 0%, 95% 35%, 85% 100%, 15% 100%, 5% 35%);
            animation: flame-outer-move 0.15s infinite steps(3);
            filter: drop-shadow(0 0 10px rgba(255, 63, 52, 0.8));
        }
        .fire-medium {
            position: absolute;
            bottom: 0;
            left: 4px;
            width: 22px;
            height: 80%;
            background-color: #ff9f43;
            clip-path: polygon(50% 0%, 90% 40%, 80% 100%, 20% 100%, 10% 40%);
            animation: flame-medium-move 0.15s infinite steps(3) 0.05s;
        }
        .fire-inner {
            position: absolute;
            bottom: 0;
            left: 9px;
            width: 12px;
            height: 55%;
            background-color: #ffea79;
            clip-path: polygon(50% 0%, 100% 50%, 80% 100%, 20% 100%, 0% 50%);
            animation: flame-inner-move 0.15s infinite steps(3) 0.1s;
        }

        @keyframes flame-outer-move {
            0% { clip-path: polygon(50% 0%, 95% 35%, 85% 100%, 15% 100%, 5% 35%); transform: scaleY(1); }
            50% { clip-path: polygon(45% 10%, 100% 50%, 90% 100%, 10% 100%, 0% 45%); transform: scaleY(1.1) scaleX(0.95); }
            100% { clip-path: polygon(55% 5%, 90% 30%, 80% 100%, 20% 100%, 10% 40%); transform: scaleY(0.95) scaleX(1.05); }
        }
        @keyframes flame-medium-move {
            0% { clip-path: polygon(50% 0%, 90% 40%, 80% 100%, 20% 100%, 10% 40%); transform: scaleY(1); }
            50% { clip-path: polygon(40% 15%, 100% 45%, 85% 100%, 15% 100%, 0% 40%); transform: scaleY(1.15); }
            100% { clip-path: polygon(60% 8%, 90% 35%, 75% 100%, 25% 100%, 15% 45%); transform: scaleY(0.9); }
        }
        @keyframes flame-inner-move {
            0% { clip-path: polygon(50% 0%, 100% 50%, 80% 100%, 20% 100%, 0% 50%); }
            50% { clip-path: polygon(45% 12%, 95% 45%, 85% 100%, 15% 100%, 5% 55%); }
            100% { clip-path: polygon(55% 5%, 100% 55%, 75% 100%, 25% 100%, 0% 45%); }
        }

        /* Hạt bụi lửa bắn nhẹ lên */
        .fire-ember {
            position: absolute;
            width: 4px;
            height: 4px;
            background-color: #ffaa00;
            box-shadow: 0 0 4px #ff3f34;
            z-index: 13;
            animation: ember-fly 2s infinite linear;
        }
        .e1 { left: 172px; bottom: 90px; animation-delay: 0s; }
        .e2 { left: 188px; bottom: 85px; animation-delay: 0.7s; }
        .e3 { left: 165px; bottom: 95px; animation-delay: 1.4s; }

        @keyframes ember-fly {
            0% { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
            15% { opacity: 1; }
            70% { transform: translateY(-70px) translateX(8px) scale(0.8); background-color: #ff3300; }
            100% { transform: translateY(-110px) translateX(-5px) scale(0); opacity: 0; }
        }

        /* Khói bay pixel dốc đứng */
        .smoke-box {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: rgba(245, 245, 245, 0.7);
            box-shadow: inset -2px -2px 0 rgba(170, 170, 170, 0.6);
            z-index: 9;
            animation: smoke-rise 4.5s infinite linear;
        }
        .s1 { left: 170px; bottom: 95px; animation-delay: 0s; }
        .s2 { left: 184px; bottom: 95px; animation-delay: 1.5s; }
        .s3 { left: 162px; bottom: 95px; animation-delay: 3s; }

        @keyframes smoke-rise {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            10% { opacity: 0.8; }
            50% { 
                transform: translateY(-80px) translateX(-15px) scale(1.3);
                background-color: rgba(255, 185, 135, 0.5);
            }
            100% { transform: translateY(-190px) translateX(-40px) scale(1.8); opacity: 0; }
        }

        /* Hoa poppy dại quyến rũ bên lửa trại */
        .poppy {
            position: absolute;
            bottom: 60px;
            left: 280px;
            width: 10px;
            height: 28px;
            z-index: 12;
        }
        .poppy-stem {
            position: absolute;
            bottom: 0;
            left: 4px;
            width: 3px;
            height: 18px;
            background-color: #1d330a;
        }
        .poppy-head {
            position: absolute;
            top: 0;
            left: 0;
            width: 10px;
            height: 10px;
            background-color: #a81717;
            box-shadow: 
                inset -3px -3px 0 #690c0c,
                3px -3px 0 #e64242,
                0 -2px 0 rgba(255, 255, 255, 0.25);
        }

        /* Những cánh hoa anh đào rơi tự do */
        .cherry-petal-2d {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: #ffb6c1;
            box-shadow: 
                inset -2px -2px 0 #db7093,
                0 -1px 0 rgba(255, 255, 255, 0.4);
            z-index: 16;
            animation: petal-fall 7s infinite linear;
        }
        .p1 { left: 15%; top: -10px; animation-duration: 5.5s; animation-delay: 0s; }
        .p2 { left: 28%; top: -10px; animation-duration: 7.5s; animation-delay: 1.8s; }
        .p3 { left: 40%; top: -10px; animation-duration: 6.5s; animation-delay: 3.2s; }
        .p4 { left: 52%; top: -10px; animation-duration: 8.5s; animation-delay: 0.8s; }

        @keyframes petal-fall {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.95; }
            90% { opacity: 0.95; }
            100% { transform: translateY(400px) translateX(70px) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="viewport">
        <div class="ambient-glow"></div>
        <div class="horizon-fog"></div>

        <div class="cloud c1"></div>
        <div class="cloud c2"></div>

        <div class="sun-container">
            <div class="sun-core"></div>
        </div>

        <div class="moon-container">
            <div class="moon-core"></div>
        </div>
        
        <div class="mountains-bg"></div>

        <div class="smoke-box s1"></div>
        <div class="smoke-box s2"></div>
        <div class="smoke-box s3"></div>

        <div class="ground-flat"></div>
        <div class="fence-left"></div>
        <div class="fence-right"></div>

        <div class="fire-ember e1"></div>
        <div class="fire-ember e2"></div>
        <div class="fire-ember e3"></div>

        <div class="campfire-glow"></div>
        <div class="campfire-2d">
            <div class="fire-wrapper">
                <div class="fire-outer"></div>
                <div class="fire-medium"></div>
                <div class="fire-inner"></div>
            </div>
            <div class="campfire-wood"></div>
            <div class="coal-glow"></div>
        </div>

        <div class="poppy">
            <div class="poppy-stem"></div>
            <div class="poppy-head"></div>
        </div>

        <div class="cherry-canopy-2d"></div>
        <div class="oak-log-2d"></div>

        <div class="cherry-petal-2d p1"></div>
        <div class="cherry-petal-2d p2"></div>
        <div class="cherry-petal-2d p3"></div>
        <div class="cherry-petal-2d p4"></div>
    </div>

</body>
</html>
